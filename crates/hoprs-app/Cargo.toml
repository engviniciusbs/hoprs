[package]
name = "hoprs-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SSH terminal, SFTP and FTP/FTPS client"

[dependencies]
hoprs-core = { path = "../hoprs-core" }
hoprs-vault = { path = "../hoprs-vault" }
hoprs-ssh = { path = "../hoprs-ssh" }
hoprs-remote = { path = "../hoprs-remote" }
hoprs-transfer = { path = "../hoprs-transfer" }
hoprs-import = { path = "../hoprs-import" }
iced = { workspace = true, features = ["image-without-codecs"] }
# iced's own crates (already in its tree, same versions), for `bench`: a user interface
# laid out and drawn without a window.
iced_runtime = "0.14"
iced_tiny_skia = "0.14"
# `net`: the agent channel (a Unix domain socket, or a named pipe on Windows). `fs`: the
# agent's `upload` looks at its local path without blocking (`agent/service/transfers.rs`).
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "io-util", "fs", "net"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
secrecy = { workspace = true }
dirs = { workspace = true }
fs4 = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
# Terminal emulation core (grid, parser, selection, search).
alacritty_terminal = { version = "0.26", default-features = false }
# Native file dialogs. Linux: the XDG desktop portal over libdbus (loaded at run time),
# falling back to zenity; no GTK, no extra D-Bus stack.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
# Remote editing: watches the local copies (inotify on Linux).
notify = "8.2"
# Splits the editor command with shell quoting rules, without running a shell. Already in
# the dependency tree (no new download), dependency-free, MIT OR Apache-2.0.
shlex = "2.0"
# Decodes the embedded window icon. iced's own `image` feature would pull in the whole
# `image` crate with every codec; `png` is the one format needed. MIT OR Apache-2.0.
png = "0.18"
# The app's text catalogs (Fluent): messages, plurals and number formatting per language.
# MIT OR Apache-2.0.
fluent-bundle = "0.16"
# Walks the catalogs' syntax tree in the key/variable parity test (already in
# fluent-bundle's tree). MIT OR Apache-2.0.
fluent-syntax = "0.12"
# Language identifiers for the Fluent bundles. MIT OR Apache-2.0.
unic-langid = "0.9"
# The OS language, for the "System" language setting. MIT OR Apache-2.0.
sys-locale = "0.3"
# Compares the running version with the latest release's (update notice). Already in the
# tree. MIT OR Apache-2.0.
semver = "1"
# Reads GitHub's release JSON by hand (update notice). Already in the tree. MIT OR Apache-2.0.
serde_json = { workspace = true }
# Checks a downloaded installer against SHA256SUMS (update notice). Already in the tree.
# MIT OR Apache-2.0.
sha2 = { workspace = true }
# The update check and download (blocking, run on the blocking pool): HTTPS only, on the
# tree's rustls with aws-lc-rs and the system roots. Without its default features it adds
# `ureq`, `ureq-proto`, `http`, `httparse` and `utf8-zero`; no OpenSSL, no ring, no
# webpki-roots. MIT OR Apache-2.0.
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
# The update download's private fallback directory (never the shared temp directory
# itself). Already in the tree. MIT OR Apache-2.0.
tempfile = { workspace = true }
# PKCE and `state` as base64url (Google Drive sign-in). Already in the tree. MIT OR Apache-2.0.
base64 = { workspace = true }
# Percent-encodes the authorisation URL and decodes the browser's callback (Google Drive
# sign-in). Already in the tree. MIT OR Apache-2.0.
percent-encoding = "2"
# The MCP server's protocol for `hoprs mcp` (the relay an agent starts): the official Rust
# SDK, which serves both protocol eras (2026-07-28 and 2025-11-25 and earlier) on one stdio
# process. Only `server` and `transport-io`, no default features (no macros, no HTTP, no
# TLS). It adds `rmcp`, `schemars`, `schemars_derive`, `serde_derive_internals`,
# `dyn-clone`, `ref-cast`, `ref-cast-impl`, `pastey`, `unicode-general-category` and
# `unicode-normalization`; no OpenSSL, no ring. Apache-2.0 (`rmcp`,
# `unicode-general-category`), MIT (`schemars`), the rest MIT OR Apache-2.0.
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-io"] }

# Unix: the update download reuses an existing file only when this user (geteuid) owns
# it. Already in the tree. MIT OR Apache-2.0.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: attach to the parent console so `hoprs.exe --version` prints (GUI subsystem),
# and open remote edits with the default editor.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    # Remote editing's `system` editor: CoInitializeEx, ShellExecuteW, SW_SHOWNORMAL.
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # The agent channel's pipe: its security descriptor from SDDL, SIDs as text, the pipe's owner.
    "Win32_Security_Authorization",
    # The agent channel's pipe: the process token, for the user's SID.
    "Win32_System_Threading",
    # The agent channel's pipe: DisconnectNamedPipe, to cut a relay that does not read.
    "Win32_System_Pipes",
] }

# Windows: the icon and version info embedded into hoprs.exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "hoprs"
path = "src/main.rs"

[lib]
bench = false

[[bench]]
name = "ui"
harness = false

[[bench]]
name = "startup"
harness = false

[dev-dependencies]
ttf-parser = "0.25"
criterion = { workspace = true }
tempfile = { workspace = true }
# The certificate of the local HTTPS server in the update client's integration test.
rcgen = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time", "test-util"] }
hoprs-remote = { path = "../hoprs-remote", features = ["testing"] }
hoprs-ssh = { path = "../hoprs-ssh", features = ["testing"] }

# Debian package, built by scripts/package-deb.sh and checked by scripts/check-deb.sh.
[package.metadata.deb]
name = "hoprs"
# A fixed project identity: no personal name or e-mail ships in the package. `.invalid`
# is reserved (RFC 2606), so the address can never reach anyone.
maintainer = "hoprs developers <noreply@hoprs.invalid>"
copyright = "hoprs developers"
license-file = ["../../LICENSE-MIT", "0"]
section = "net"
priority = "optional"
extended-description = """\
hoprs is a fast, native desktop client for SSH, SFTP, FTP and FTPS. Save your sites, \
group them into workspaces, browse local and remote files side by side, and queue \
transfers that resume and handle conflicts. SSH sites open a terminal, a file browser, \
or both over one connection. Credentials live in the system keyring, and sites can be \
imported from FileZilla."""
# `$auto` covers what the binary links (libc6 only). The rest is loaded at run time
# (dlopen), which `$auto` cannot see; the list is every `lib*.so.N` name in the binary,
# confirmed by scripts/check-deb.sh (the start-up probe under Xvfb on a clean Ubuntu 24.04
# fails without the X11 ones, and every library it loads must come from here):
# - ca-certificates: the system roots FTPS trusts (rustls-native-certs reads them);
# - libx11-6, libx11-xcb1, libxcb1, libxcursor1, libxi6: winit's X11 backend;
# - libxkbcommon0, libxkbcommon-x11-0: winit's keyboard handling (X11 and Wayland);
# - libwayland-client0: winit's Wayland backend; libwayland-egl1: wgpu's GL on Wayland;
# - libvulkan1, libegl1: wgpu's Vulkan and GL loaders. libegl1 brings in Mesa, whose
#   software adapter (llvmpipe) iced would use on a machine without a GPU; hoprs picks
#   tiny-skia itself there (src/renderer.rs);
# - libdbus-1-3: rfd's file dialogs through the XDG desktop portal.
depends = """$auto, ca-certificates, libx11-6, libx11-xcb1, libxcb1, libxcursor1, libxi6, \
libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libwayland-egl1, libvulkan1, libegl1, \
libdbus-1-3"""
recommends = "xdg-desktop-portal, gnome-keyring | kwalletmanager | keepassxc"
suggests = "openssh-client"
assets = [
    ["target/release/hoprs", "usr/bin/", "755"],
    ["../../packaging/linux/io.github.engviniciusbs.hoprs.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/io.github.engviniciusbs.hoprs.metainfo.xml", "usr/share/metainfo/", "644"],
    ["assets/icon/hoprs.svg", "usr/share/icons/hicolor/scalable/apps/io.github.engviniciusbs.hoprs.svg", "644"],
    ["assets/icon/hoprs-16.png", "usr/share/icons/hicolor/16x16/apps/io.github.engviniciusbs.hoprs.png", "644"],
    ["assets/icon/hoprs-24.png", "usr/share/icons/hicolor/24x24/apps/io.github.engviniciusbs.hoprs.png", "644"],
    ["assets/icon/hoprs-32.png", "usr/share/icons/hicolor/32x32/apps/io.github.engviniciusbs.hoprs.png", "644"],
    ["assets/icon/hoprs-48.png", "usr/share/icons/hicolor/48x48/apps/io.github.engviniciusbs.hoprs.png", "644"],
    ["assets/icon/hoprs-64.png", "usr/share/icons/hicolor/64x64/apps/io.github.engviniciusbs.hoprs.png", "644"],
    ["assets/icon/hoprs-128.png", "usr/share/icons/hicolor/128x128/apps/io.github.engviniciusbs.hoprs.png", "644"],
    ["assets/icon/hoprs-256.png", "usr/share/icons/hicolor/256x256/apps/io.github.engviniciusbs.hoprs.png", "644"],
    ["assets/icon/hoprs-512.png", "usr/share/icons/hicolor/512x512/apps/io.github.engviniciusbs.hoprs.png", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/hoprs/", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/hoprs/", "644"],
    ["assets/fonts/OFL-Inter.txt", "usr/share/doc/hoprs/fonts/", "644"],
    ["assets/fonts/OFL-JetBrainsMono.txt", "usr/share/doc/hoprs/fonts/", "644"],
    ["assets/fonts/LICENSE-Phosphor.txt", "usr/share/doc/hoprs/fonts/", "644"],
]

# macOS and Windows installers, built with cargo-packager (the version is pinned in the
# scripts that call it). The package's identity comes first, shared by every platform,
# then one table per platform. Relative paths are from this directory.
# macOS: scripts/package-macos.sh builds the universal binary itself, asks cargo-packager
# for the `app` format only, then signs ad hoc and makes the .dmg with hdiutil; checked
# by scripts/check-macos.sh.
# Windows: scripts/package-windows.sh builds the binary, then runs cargo-packager's `wix`
# format with this table plus two overrides (the MSI version, numeric X.Y.Z; the WiX
# template with the upgrade code below filled in), and makes the portable .zip; checked
# by scripts/check-windows.ps1.
[package.metadata.packager]
product-name = "hoprs"
identifier = "online.hoprs.hoprs"
description = "SSH terminal, SFTP and FTP/FTPS client"
# The same text as [package.metadata.deb] extended-description.
long-description = """\
hoprs is a fast, native desktop client for SSH, SFTP, FTP and FTPS. Save your sites, \
group them into workspaces, browse local and remote files side by side, and queue \
transfers that resume and handle conflicts. SSH sites open a terminal, a file browser, \
or both over one connection. Credentials live in the system keyring, and sites can be \
imported from FileZilla."""
homepage = "https://hoprs.online"
copyright = "hoprs developers"
license-file = "../../LICENSE-MIT"
# The .app takes the .icns as is (the first .icns listed); the .msi takes the first .ico
# (Add/Remove Programs and the Start menu shortcut).
icons = ["assets/icon/hoprs.icns", "assets/icon/hoprs.ico"]
# The bundled fonts' licences (OFL for Inter and JetBrains Mono, MIT for Phosphor): in the
# .app's Contents/Resources/licenses and next to hoprs.exe in the .msi.
resources = [
    { src = "assets/fonts/OFL-Inter.txt", target = "licenses/OFL-Inter.txt" },
    { src = "assets/fonts/OFL-JetBrainsMono.txt", target = "licenses/OFL-JetBrainsMono.txt" },
    { src = "assets/fonts/LICENSE-Phosphor.txt", target = "licenses/LICENSE-Phosphor.txt" },
]

[package.metadata.packager.macos]
# Also the binary's deployment target (MACOSX_DEPLOYMENT_TARGET in package-macos.sh).
minimum-system-version = "11.0"

[package.metadata.packager.wix]
# Per-machine (InstallScope="perMachine", under %ProgramFiles%\hoprs): cargo-packager's
# template, vendored with the upgrade code as a placeholder that package-windows.sh fills
# in from [package.metadata.msi]. As checked in it is not a GUID, so a direct
# `cargo packager -f wix` fails instead of making an .msi with another upgrade code.
template = "../../packaging/windows/main.wxs"

# Read by scripts/package-windows.sh only (cargo-packager refuses keys it does not know,
# so this cannot live under [package.metadata.packager]).
[package.metadata.msi]
# The MSI UpgradeCode: what makes Windows treat every hoprs .msi as the same product, so
# a newer one replaces the installed one instead of installing beside it. Generated once
# (uuidgen, 2026-11-14). NEVER change it: installs made with another code would no longer
# be upgraded or replaced by new releases.
upgrade-code = "F7D6EEBE-DF5B-4C17-BA3B-40FAF918E8C3"
