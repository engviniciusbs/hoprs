[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = "1.54"
tokio-util = "0.7"
async-trait = "0.1"
futures-util = { version = "0.3.26", default-features = false, features = ["std"] }
thiserror = "2"
rusqlite = { version = "0.42", features = ["bundled"] }
tempfile = "3"
criterion = "0.7"
russh = "0.65"
russh-sftp = "3.0"
secrecy = "0.10"
zeroize = "1"
sha2 = "0.10"
base64 = "0.22"
hmac = "0.12"
# TCP keepalive on the SSH and FTP sockets (`all`: the probe count).
socket2 = { version = "0.6", features = ["all"] }
suppaftp = { version = "12.2", features = ["tokio", "tokio-rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "logging", "tls12"] }
rustls-native-certs = "0.8"
# The verifier rustls uses; only to read the errors it wraps.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "7"
keyring = "4"
keyring-core = "1"
argon2 = "0.6"
chacha20poly1305 = "0.11"
serde_json = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
quick-xml = "0.42"
# GUI (hoprs-app only).
iced = { version = "0.14.0", features = ["tokio", "advanced", "wgpu", "tiny-skia"] }
fs4 = "1.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
