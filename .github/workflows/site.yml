name: Site

# The landing page under site/. Builds on every change to it; on main it also
# deploys to https://hoprs.online (the VPS, see site/deploy/README.md), but only
# once the GitHub Release for facts.ts's version exists (published, not a prerelease):
# the page links to its assets. When the Release workflow finishes, the deploy runs again.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml', 'Cargo.toml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml', 'Cargo.toml']
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # A workflow_run builds GITHUB_SHA (the default branch head), only after a successful release.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Build before test: the prerender test reads dist/.
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist

  deploy:
    needs: build
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'workflow_run' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hoprs.online
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    env:
      # Pinned host key of 92.113.39.90 (checked against the server's
      # /etc/ssh/ssh_host_ed25519_key.pub on 2026-11-14). Never ssh-keyscan here.
      SITE_HOST_KEY: '92.113.39.90 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA/99jx1mIPxWRQXcSXWs6bYltIxejjWyMKAbQnEHmJQ'
    steps:
      # Needs the checkout only for the version in facts.ts; the dist comes from the build job.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: site/src/facts.ts
          sparse-checkout-cone-mode: false
      - name: Check the release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^const version = "\(.*\)";/\1/p' site/src/facts.ts)"
          if [ -z "$VERSION" ]; then echo "::error::no version in site/src/facts.ts"; exit 1; fi
          if info="$(gh release view "v$VERSION" --repo ${{ github.repository }} --json isDraft,isPrerelease 2>&1)" \
            && [ "$(jq -r '.isDraft or .isPrerelease' <<<"$info")" = "false" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            # gh's own message (not found, auth, rate limit, network) or the draft/prerelease JSON stays in the notice.
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release v$VERSION is not ready (missing, draft or prerelease, or gh failed): $(tr '\n' ' ' <<<"$info"). Skipping the deploy; it runs again when the Release workflow succeeds."
          fi
      - if: steps.release.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Publish to the VPS
        if: steps.release.outputs.ready == 'true'
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SITE_DEPLOY_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$SITE_HOST_KEY" > "$RUNNER_TEMP/known_hosts"
          # The key's forced command (hoprs-site-receive) takes only the SHA.
          tar -C dist -c . | ssh -i "$RUNNER_TEMP/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o StrictHostKeyChecking=yes \
            hoprs-site@92.113.39.90 "$GITHUB_SHA"
          rm -f "$RUNNER_TEMP/key"
      - name: Check the live page
        if: steps.release.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # Fetch to a file first: `curl | grep -q` fails under pipefail when grep exits
          # early and curl gets a write error (23).
          curl -fsS https://hoprs.online/ -o "$RUNNER_TEMP/en.html"
          grep -q '<h1' "$RUNNER_TEMP/en.html"
          curl -fsS https://hoprs.online/pt-br/ -o "$RUNNER_TEMP/pt-br.html"
          grep -q 'lang="pt-BR"' "$RUNNER_TEMP/pt-br.html"
          curl -fsS https://hoprs.online/privacy/ -o "$RUNNER_TEMP/privacy.html"
          # Not the contact address: Cloudflare's email obfuscation rewrites it in the
          # served HTML (the build's own tests check the address in dist/).
          grep -q 'data-page="privacy"' "$RUNNER_TEMP/privacy.html"
