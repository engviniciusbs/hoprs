# Publishes a GitHub Release when a v* tag is pushed: hoprs_<version>-1_amd64.deb,
# hoprs_<version>_macos_universal.dmg, hoprs_<version>_windows_x64.msi,
# hoprs_<version>_windows_x64.zip and SHA256SUMS over the four, with the tag's
# CHANGELOG.md section and the Installing block as the notes (scripts/release-notes.sh).
# Each system builds and checks its files in its own job; `publish` runs only when all
# three passed, and every check runs before its `gh release create`, so a failure at any
# step publishes nothing.
#
# A manual run (workflow_dispatch, e.g. `gh workflow run release.yml --ref <branch>`) is a
# dry run: the version comes from Cargo.toml, there is no tag check and no notes, the
# three build jobs build, check and upload their files as workflow artifacts, and
# `publish` is skipped.
#
# The build steps get the Google Drive OAuth client from the repository secrets
# HOPRS_GOOGLE_CLIENT_ID and HOPRS_GOOGLE_CLIENT_SECRET (read by the compiler with
# option_env!). Without them the build is still valid and hides the Drive destination.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per tag; a second push of the same tag waits, and then fails at
# `gh release create` because the release already exists.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# No job here uses a cache: a release is always a clean build.
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Version (and, on a tag, the tag matches it)
        id: version
        env:
          IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          crate_version=$(scripts/workspace-version.sh)
          if [ "$IS_TAG" = "true" ]; then
            tag_version=${GITHUB_REF_NAME#v}
            if [ "$tag_version" != "$crate_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME is version $tag_version, but [workspace.package] version in Cargo.toml is $crate_version"
              exit 1
            fi
          else
            echo "Dry run ($GITHUB_EVENT_NAME on $GITHUB_REF_NAME): version $crate_version from Cargo.toml, no tag check, nothing is published"
          fi
          echo "version=$crate_version" >> "$GITHUB_OUTPUT"

      # Says whether the builds carry the Google Drive OAuth client (the secrets below
      # arrive as empty strings when unset). The app shows Drive only with both values,
      # so the notice says "enabled" only then. Never prints a value.
      - name: Google Drive destination
        env:
          CLIENT_ID: ${{ secrets.HOPRS_GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.HOPRS_GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ]; then
            echo "::notice::Google Drive destination: enabled"
          else
            echo "::notice::Google Drive destination: hidden (the client id and the client secret must both be in the repository secrets)"
          fi

      # Before the builds: a missing or empty CHANGELOG section fails in seconds.
      - name: Release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/release-notes.sh "$VERSION" > notes.md
          cat notes.md

      - name: Keep the notes for publish
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  linux:
    needs: prepare
    # package-deb.sh builds inside an Ubuntu 24.04 container, so the host does not
    # matter for the binary; it is named anyway.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # No token in .git/config: package-deb.sh mounts the repository into the build
      # container, where every build script and proc-macro runs.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the .deb
        env:
          HOPRS_GOOGLE_CLIENT_ID: ${{ secrets.HOPRS_GOOGLE_CLIENT_ID }}
          HOPRS_GOOGLE_CLIENT_SECRET: ${{ secrets.HOPRS_GOOGLE_CLIENT_SECRET }}
        run: |
          deb=$(scripts/package-deb.sh)
          echo "DEB=$deb" >> "$GITHUB_ENV"

      # HOPRS_BUILDER_HOME: prefixes that must not appear in the binary. The runner's
      # $HOME, and the container build's: its HOME is /tmp (checked as /tmp/.cargo and
      # /tmp/.rustup, since a bare /tmp is legitimately in the binary, e.g.
      # /tmp/.X11-unix), the repository at /src, the image's toolchain in /opt.
      - name: Check the .deb on a clean Ubuntu 24.04
        run: |
          HOPRS_BUILDER_HOME="$HOME:/tmp/.cargo:/tmp/.rustup:/src/crates/:/src/target/:/opt/cargo/:/opt/rustup/" \
            scripts/check-deb.sh "$DEB"

      - uses: actions/upload-artifact@v4
        with:
          name: hoprs-linux
          path: ${{ env.DEB }}
          if-no-files-found: error

  # scripts/package-macos.sh: both Apple targets with the pinned toolchain, --locked,
  # lipo, the .app, ad-hoc signature, hdiutil. scripts/check-macos.sh checks it.
  macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build the .dmg
        env:
          HOPRS_GOOGLE_CLIENT_ID: ${{ secrets.HOPRS_GOOGLE_CLIENT_ID }}
          HOPRS_GOOGLE_CLIENT_SECRET: ${{ secrets.HOPRS_GOOGLE_CLIENT_SECRET }}
        run: |
          dmg=$(scripts/package-macos.sh)
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - name: Check the .dmg
        run: scripts/check-macos.sh "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: hoprs-macos
          path: ${{ env.DMG }}
          if-no-files-found: error

  # scripts/package-windows.sh (Git Bash): the pinned toolchain, --locked, remapped
  # paths, static C runtime, the WiX .msi with the fixed upgrade code, the portable .zip.
  # scripts/check-windows.ps1 installs, runs, reinstalls and uninstalls it on the runner.
  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build the .msi and the .zip
        env:
          HOPRS_GOOGLE_CLIENT_ID: ${{ secrets.HOPRS_GOOGLE_CLIENT_ID }}
          HOPRS_GOOGLE_CLIENT_SECRET: ${{ secrets.HOPRS_GOOGLE_CLIENT_SECRET }}
        shell: bash
        run: |
          paths=$(scripts/package-windows.sh)
          echo "MSI=$(sed -n 1p <<<"$paths")" >> "$GITHUB_ENV"
          echo "ZIP=$(sed -n 2p <<<"$paths")" >> "$GITHUB_ENV"

      - name: Check the .msi and the .zip
        shell: pwsh
        run: scripts/check-windows.ps1 -Msi $env:MSI -Zip $env:ZIP

      - uses: actions/upload-artifact@v4
        with:
          name: hoprs-windows
          path: |
            ${{ env.MSI }}
            ${{ env.ZIP }}
          if-no-files-found: error

  publish:
    needs: [prepare, linux, macos, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # gh needs a repository for --verify-tag; no token in .git/config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Download the build files
        uses: actions/download-artifact@v4
        with:
          pattern: hoprs-*
          path: dist
          merge-multiple: true

      # Exactly the four assets, one per kind, and nothing else in dist/.
      - name: SHA256SUMS
        run: |
          cd dist
          ls -l
          for pattern in 'hoprs_*_amd64.deb' 'hoprs_*_macos_universal.dmg' \
            'hoprs_*_windows_x64.msi' 'hoprs_*_windows_x64.zip'; do
            # shellcheck disable=SC2206 # the glob is meant to expand
            matches=($pattern)
            if [ "${#matches[@]}" -ne 1 ] || [ ! -f "${matches[0]}" ]; then
              echo "::error::expected exactly one $pattern in dist/, found: ${matches[*]}"
              exit 1
            fi
          done
          if [ "$(find . -mindepth 1 | wc -l)" -ne 4 ]; then
            echo "::error::dist/ must hold exactly the four assets"
            exit 1
          fi
          sha256sum hoprs_*.deb hoprs_*.dmg hoprs_*.msi hoprs_*.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      # All or nothing: a draft first (invisible to users), the assets uploaded and
      # verified against the local files, and only then made public.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag "${prerelease[@]}" \
            --title "hoprs $VERSION" --notes-file notes.md
          echo "DRAFT_CREATED=1" >> "$GITHUB_ENV"

      # Downloaded back and checked against SHA256SUMS: the bytes on the release, not
      # just their sizes. A draft's assets download with the token.
      - name: Upload and verify the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/hoprs_*.deb dist/hoprs_*.dmg dist/hoprs_*.msi dist/hoprs_*.zip dist/SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}"
          check="$RUNNER_TEMP/release-assets"
          mkdir "$check"
          gh release download "$GITHUB_REF_NAME" --dir "$check"
          ls -l "$check"
          for file in "${assets[@]}"; do
            if [ ! -f "$check/$(basename "$file")" ]; then
              echo "::error::asset $(basename "$file") is not on the release"
              exit 1
            fi
          done
          cmp dist/SHA256SUMS "$check/SHA256SUMS"
          (cd "$check" && sha256sum --check --strict SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      # A failed or cancelled run leaves no draft behind, so a re-run can create it again.
      # Only a draft this run created is deleted (never a published release, never the tag).
      - name: Delete the draft on failure or cancel
        if: (failure() || cancelled()) && env.DRAFT_CREATED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
